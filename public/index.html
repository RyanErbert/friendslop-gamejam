<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Game</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; }
    canvas { display: block; }
    #name-screen {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      font-family: monospace;
      color: white;
    }
    #name-screen h1 { font-size: 28px; margin-bottom: 20px; }
    #name-input {
      font-size: 20px;
      padding: 8px 16px;
      font-family: monospace;
      text-align: center;
      border: 2px solid #fff;
      background: rgba(255,255,255,0.1);
      color: white;
      border-radius: 6px;
      outline: none;
      max-width: 200px;
    }
    #name-input::placeholder { color: rgba(255,255,255,0.4); }
    #join-btn {
      margin-top: 16px;
      padding: 10px 32px;
      font-size: 18px;
      font-family: monospace;
      font-weight: bold;
      background: #4488ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #join-btn:hover { background: #3366dd; }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: monospace;
      font-size: 14px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    #joystick-base {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 3px solid rgba(255,255,255,0.4);
      touch-action: none;
    }
    #joystick-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #jump-btn {
      position: absolute;
      bottom: 40px;
      right: 40px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      border: 3px solid rgba(255,255,255,0.6);
      color: white;
      font-family: monospace;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }
    #jump-btn:active {
      background: rgba(255,255,255,0.5);
    }
  </style>
</head>
<body>
  <div id="name-screen">
    <h1>Enter your name</h1>
    <input id="name-input" type="text" placeholder="Name" maxlength="16" autofocus>
    <button id="join-btn">JOIN</button>
  </div>
  <div id="hud" style="display:none;">WASD to move &middot; Space to jump</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
