<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cube Fight!</title>
  <style>
    @font-face {
      font-family: '04b_03';
      src: url('/fonts/04B_03__.TTF') format('truetype');
      font-display: swap;
    }
    @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap');
    * { margin: 0; padding: 0; }
    body { overflow: hidden; }
    canvas { display: block; }
    #name-screen {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      color: white;
      gap: 12px;
    }
    #title-canvas { image-rendering: pixelated; margin-bottom: 4px; }
    #name-screen label { font-size: 13px; color: #aaa; }
    #name-input {
      font-size: 18px;
      padding: 6px 14px;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      text-align: center;
      border: 2px solid #fff;
      background: rgba(255,255,255,0.1);
      color: white;
      border-radius: 6px;
      outline: none;
      max-width: 200px;
      width: 200px;
    }
    #name-input::placeholder { color: rgba(255,255,255,0.4); }
    .option-row {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }
    .shape-btn {
      width: 50px; height: 50px;
      border: 2px solid #555;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      color: white;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s;
    }
    .shape-btn.selected { border-color: #4488ff; background: rgba(68,136,255,0.2); }
    .shape-btn:hover { border-color: #88aaff; }
    #color-picker {
      width: 50px; height: 40px;
      border: none; border-radius: 6px;
      cursor: pointer; background: none;
    }
    #join-btn {
      margin-top: 8px;
      padding: 10px 32px;
      font-size: 18px;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      font-weight: bold;
      background: #4488ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #join-btn:hover { background: #3366dd; }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      font-size: 14px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    #leader-display {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      text-align: center;
      display: none;
      pointer-events: none;
    }
    #leader-display .crown { font-size: 22px; }
    #joystick-base {
      position: absolute;
      bottom: 30px; left: 30px;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 3px solid rgba(255,255,255,0.4);
      touch-action: none;
    }
    #joystick-knob {
      position: absolute; top: 50%; left: 50%;
      width: 50px; height: 50px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #jump-btn {
      position: absolute;
      bottom: 40px; right: 40px;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      border: 3px solid rgba(255,255,255,0.6);
      color: white;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      font-size: 16px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none;
      touch-action: none;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }
    #jump-btn:active { background: rgba(255,255,255,0.5); }

    /* Scoreboard */
    #scoreboard {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.82);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      padding: 16px 24px;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      color: white;
      z-index: 20;
      display: none;
      min-width: 260px;
      pointer-events: none;
    }
    #scoreboard h3 {
      text-align: center;
      margin: 0 0 10px 0;
      font-size: 16px;
      letter-spacing: 2px;
      color: #aaa;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 6px;
    }
    .sb-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 14px;
    }
    .sb-row.holder { color: #ff6666; }
    .sb-row.leader { color: #ffd700; }
    .sb-name { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sb-score { font-weight: bold; min-width: 40px; text-align: right; }

    /* Meters */
    .meter-wrap {
      position: absolute;
      bottom: 28px;
      width: 180px;
      height: 10px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 5px;
      overflow: visible;
      pointer-events: none;
      z-index: 5;
    }
    #sprint-meter { left: calc(50% - 195px); }
    #jump-meter   { left: calc(50% + 15px); }
    .meter-fill {
      height: 100%;
      width: 100%;
      border-radius: 4px;
      transition: background-color 0.15s;
    }
    /* Level select */
    #level-select {
      display: none;
      text-align: center;
      margin-bottom: 12px;
      max-width: 600px;
    }
    #level-select h2 {
      font-size: 14px;
      color: #888;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    .level-grid {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .level-card {
      cursor: pointer;
      border: 2px solid #555;
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s;
      background: rgba(0,0,0,0.3);
    }
    .level-card:hover {
      border-color: #88aaff;
      transform: scale(1.05);
    }
    .level-card.selected {
      border-color: #4488ff;
      box-shadow: 0 0 12px rgba(68,136,255,0.5);
    }
    .level-card canvas { display: block; }
    .level-label {
      padding: 4px 8px;
      font-size: 12px;
      text-align: center;
      color: #ccc;
      text-transform: capitalize;
    }

    .meter-label {
      position: absolute;
      top: -18px;
      left: 0;
      font-family: '04b_03', Lato, LatoExtended, sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div id="name-screen">
    <canvas id="title-canvas" width="200" height="40" style="width:800px;height:160px;image-rendering:pixelated;"></canvas>
    <input id="name-input" type="text" placeholder="Name" maxlength="16" autofocus>
    <div id="cube-preview-wrap" style="display:flex;flex-direction:column;align-items:center;gap:4px;margin:4px 0;">
      <canvas id="cube-preview" width="120" height="120" style="border-radius:8px;cursor:pointer;"></canvas>
      <span style="font-size:12px;color:#aaa;letter-spacing:1px;">CUSTOMIZE CHARACTER</span>
      <div class="option-row" style="margin-top:2px;">
        <input type="color" id="color-picker" value="#4488ff">
      </div>
    </div>
    <div id="level-select"></div>
    <button id="join-btn">PLAY</button>
  </div>
  <div id="hud" style="display:none;">WASD to move &middot; Space to jump &middot; Shift to sprint</div>
  <div id="leader-display"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
